<script type="text/plain" id="gas">
/* TSEKmate -> Google Sheets receiver. Paste into Extensions > Apps Script, then Deploy > Web app (Execute as: Me, Access: Anyone). */
function out(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON)}
function col(n){var s='';while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
function safe(v){v=String(v==null?'':v);return /^[=+\-@]/.test(v)?"'"+v:v}

function doGet(e){var c=e&&e.parameter&&e.parameter.c;
  if(!c)return out({ok:true,app:'TSEKmate',url:SpreadsheetApp.getActiveSpreadsheet().getUrl()});
  var v=pubSheet().getDataRange().getValues(),i;c=String(c).toUpperCase();
  for(i=1;i<v.length;i++)if(String(v[i][0])===c&&String(v[i][1])==='0'){var m=JSON.parse(v[i][4]);return out({ok:true,cls:v[i][2],roster:m.roster,at:m.at})}
  return out({ok:false,error:'Class not found. Ask your teacher to publish the results first.'})}
function pubSheet(){var ss=SpreadsheetApp.getActiveSpreadsheet(),sh=ss.getSheetByName('_students');if(!sh){sh=ss.insertSheet('_students');sh.getRange(1,1,1,5).setValues([['Class code','Paper No','Name','PIN','Data']]);sh.hideSheet()}return sh}
function pub(d){var code=String(d.code||'').toUpperCase();if(!/^[A-Z0-9]{4,8}$/.test(code)||!d.students)throw new Error('Bad class data');
  var sh=pubSheet(),v=sh.getDataRange().getValues(),rows=[v[0]],i;
  for(i=1;i<v.length;i++)if(String(v[i][0])!==code)rows.push(v[i]);
  rows.push([code,0,String(d.cls||''),'',JSON.stringify({at:Date.now(),roster:d.students.map(function(s){return {n:s.n,name:s.name}})})]);
  d.students.forEach(function(s){rows.push([code,s.n,s.name,String(s.pin),JSON.stringify({res:s.res})])});
  sh.clearContents();var rg=sh.getRange(1,1,rows.length,5);rg.setNumberFormat('@');rg.setValues(rows);return {ok:true,count:d.students.length}}
function me(d){var v=pubSheet().getDataRange().getValues(),i,c=String(d.c||'').toUpperCase();
  for(i=1;i<v.length;i++)if(String(v[i][0])===c&&String(v[i][1])===String(d.n)){
    if(String(v[i][3])!==String(d.pin))return {ok:false,error:'That PIN is not right. Ask your teacher.'};
    return {ok:true,name:v[i][2],data:JSON.parse(v[i][4])}}
  return {ok:false,error:'Student not found.'}}

function doPost(e){
  var lock=LockService.getScriptLock();lock.waitLock(20000);
  try{
    var d=JSON.parse(e.postData.contents),ss=SpreadsheetApp.getActiveSpreadsheet();
    if(d.type=='pub')return out(pub(d));if(d.type=='me')return out(me(d));
    if(!d.id||!d.key||!d.key.length)throw new Error('Incomplete data');
    var name=String(d.exam||'Exam').replace(/[\[\]*?:\/\\]/g,' ').substring(0,90);
    var sh=ss.getSheetByName(name)||setup(ss,name,d);
    var n=d.key.length,idc=6+n,last=col(5+n),rows=Math.max(sh.getLastRow()-3,1);
    var ids=sh.getRange(4,idc,rows,1).getValues(),r=0,i;
    for(i=0;i<ids.length;i++){if(ids[i][0]===d.id){r=4+i;break}}   /* same paper sent twice = update, never a duplicate */
    if(!r)r=Math.max(sh.getLastRow()+1,4);
    var ans=(d.answers||[]).slice(0,n);while(ans.length<n)ans.push('');
    sh.getRange(r,1,1,idc).setValues([[safe(d.student),'',d.total,'',new Date(d.at||Date.now())].concat(ans,[d.id])]);
    sh.getRange(r,2).setFormula('=SUMPRODUCT(--(F'+r+':'+last+r+'=F$2:'+last+'$2))');   /* edit an answer cell and the score updates */
    sh.getRange(r,4).setFormula('=IFERROR(B'+r+'/C'+r+',0)').setNumberFormat('0%');
    sh.getRange(r,5).setNumberFormat('dd mmm HH:mm');
    return out({ok:true,url:ss.getUrl()+'#gid='+sh.getSheetId(),row:r});
  }catch(err){return out({ok:false,error:String(err)})}
  finally{lock.releaseLock()}
}

function setup(ss,name,d){
  var n=d.key.length,sh=ss.insertSheet(name),last=col(5+n),hd=['Student','Score','Total','Percent','Scanned'],i;
  for(i=1;i<=n;i++)hd.push('Q'+i);hd.push('Paper ID');
  sh.getRange(1,1,1,hd.length).setValues([hd]).setFontWeight('bold').setBackground('#0B1530').setFontColor('#FFFFFF');
  sh.getRange(2,1,1,n+6).setValues([['ANSWER KEY','','','',''].concat(d.key,[''])]).setFontWeight('bold').setBackground('#FFF3BF');
  var f=['% CORRECT BY ITEM','','','',''];
  for(i=0;i<n;i++){var c=col(6+i);f.push('=IFERROR(SUMPRODUCT(--('+c+'$4:'+c+'$1000='+c+'$2))/COUNTA($A$4:$A$1000),"")')}
  f.push('');
  sh.getRange(3,1,1,f.length).setFormulas([f]).setNumberFormat('0%').setFontStyle('italic').setBackground('#E8EEFF');
  sh.setFrozenRows(3);sh.setFrozenColumns(1);sh.setColumnWidth(1,200);sh.hideColumns(6+n);
  var rg=sh.getRange('F4:'+last+'1000');
  sh.setConditionalFormatRules([
    SpreadsheetApp.newConditionalFormatRule().whenFormulaSatisfied('=AND(F4<>"",F4=F$2)').setBackground('#C8F2DC').setRanges([rg]).build(),
    SpreadsheetApp.newConditionalFormatRule().whenFormulaSatisfied('=AND(F4<>"",F4<>F$2)').setBackground('#FFD6D1').setRanges([rg]).build()]);
  return sh;
}
</script>

 async put(s,v){if(me&&S.includes(s)&&!v.owner)v.owner=me.id;if(await idb())return tx(s,'readwrite',o=>o.put(v));mem[s]=mem[s].filter(x=>x.id!=v.id).concat(v)},
 async del(s,id){if(await idb())return tx(s,'readwrite',o=>o.delete(id));mem[s]=mem[s].filter(x=>x.id!=id)},

/* ===== Domain logic (Step 4 will build on these) ===== */
const score=(key,ans)=>ans.filter((a,i)=>a&&a==key[i]).length;
async function saveSheet(ex,student,answers){
 const id=uid();

}
function download(name,rows){ /* UTF-8 BOM so Excel opens Filipino names correctly */
 const csv=rows.map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\r\n');

/* ===== Item-analysis engine: difficulty, discrimination (upper/lower 27%), distractors, KR-20 ===== */
/*ITEM-START*/
const ITEM=(()=>{
 const LET=['A','B','C','D'];
 function analyze(key,papers){
  const N=papers.length,n=key.length;if(N<2)return null;
  const tot=papers.map(a=>a.reduce((s,x,i)=>s+(x&&x==key[i]?1:0),0)),
   ord=tot.map((_,i)=>i).sort((a,b)=>tot[b]-tot[a]||a-b),k=Math.max(1,Math.round(.27*N)),up=ord.slice(0,k),lo=ord.slice(N-k),
   mean=tot.reduce((a,b)=>a+b,0)/N,vr=tot.reduce((a,t)=>a+(t-mean)**2,0)/N;let pq=0;
  const items=key.map((kc,i)=>{
   const cnt={A:0,B:0,C:0,D:0,'':0};papers.forEach(a=>cnt[a[i]||'']++);
   const p=cnt[kc]/N,u=up.filter(j=>papers[j][i]==kc).length,l=lo.filter(j=>papers[j][i]==kc).length,D=(u-l)/k;pq+=p*(1-p);
   const dead=LET.filter(x=>x!=kc&&cnt[x]/N<.05),bad=LET.find(x=>x!=kc&&up.filter(j=>papers[j][i]==x).length>u),why=[];
   if(D<0)why.push('Stronger students did worse on this item than weaker ones.');
   else if(D<.2)why.push('Weak discrimination (D under 0.20).');
   if(bad)why.push('More top scorers chose '+bad+' than the key '+kc+'. Check the answer key.');
   if(p<.25)why.push('Very hard: under 25% answered correctly.');
   if(p>.85)why.push('Very easy: over 85% answered correctly.');
   if(dead.length)why.push('Nobody chose '+dead.join(', ')+', so '+(dead.length>1?'those options do':'that option does')+' not distract.');
   const d=D<0||(bad&&D<.1)?'discard':(D<.2||p<.25||p>.85||dead.length>1)?'revise':'keep';
   const xs=papers.map(a=>a[i]==kc?1:0),ys=xs.map((x,j)=>tot[j]-x),my=ys.reduce((a,b)=>a+b,0)/N,sy=Math.sqrt(ys.reduce((a,y)=>a+(y-my)**2,0)/N),sx=Math.sqrt(p*(1-p)),
    pb=sx&&sy?xs.reduce((a,x,j)=>a+(x-p)*(ys[j]-my),0)/N/(sx*sy):0,
    dl=D>=.4?'Very good':D>=.3?'Good':D>=.2?'Fair':D>=0?'Poor':'Negative',pl=p>=.81?'Very easy':p>=.61?'Easy':p>=.41?'Moderate':p>=.21?'Difficult':'Very difficult',
    opt=Object.fromEntries(LET.map(x=>[x,{u:up.filter(j=>papers[j][i]==x).length,l:lo.filter(j=>papers[j][i]==x).length}])),
    fb=bad&&D<.2?'Check the answer key first. Stronger students prefer '+bad+'. If '+bad+' is really correct, rescore the item; if not, reword it.':D<0?'This item may be ambiguous or miskeyed. Reread the question and options, then reword or replace it.':p<.25?'Too hard for this class. Reteach the topic, then keep the item only if the content was taught.':p>.85&&D<.2?'Too easy to tell students apart. Keep it as a warm-up or replace it with a harder item.':dead.length?'Replace the unused option'+(dead.length>1?'s ':' ')+dead.join(', ')+' with believable wrong answers.':D<.2?'Weak at separating strong from weak students. Tighten the wording and make the wrong options more tempting.':'Good item. Keep it in your question bank.';
   return{q:i+1,key:kc,p,D,cnt,d,why,fd:3-dead.length,pb,dl,pl,opt,fb}});
  const c={keep:0,revise:0,discard:0};items.forEach(x=>c[x.d]++);
  const kr=n>1&&vr>0?n/(n-1)*(1-pq/vr):null,so=[...tot].sort((a,b)=>a-b),pc=tot.map(t=>t/n*100);
  return{N,n,k,tot,mean,sd:Math.sqrt(vr),kr20:kr,items,c,med:(so[(N-1)>>1]+so[N>>1])/2,min:so[0],max:so[N-1],sem:kr==null?null:Math.sqrt(vr)*Math.sqrt(Math.max(0,1-kr)),
   pass:pc.filter(x=>x>=75).length/N,bands:[pc.filter(x=>x>=85).length,pc.filter(x=>x>=75&&x<85).length,pc.filter(x=>x>=50&&x<75).length,pc.filter(x=>x<50).length]};
 }
 function compare(key,reads,truths){const a=analyze(key,reads),b=analyze(key,truths),f=x=>x.toFixed(2),m=g=>a.items.filter((x,i)=>g(x,b.items[i])).length;
  return{a,b,n:key.length,dia:m((x,y)=>f(x.p)==f(y.p)),disa:m((x,y)=>f(x.D)==f(y.D)),dea:m((x,y)=>x.fd==y.fd)}}

})();
/*ITEM-END*/

/* ===== Study statistics: paired t-test (exact p via incomplete beta) and SUS scoring ===== */
/*STAT-START*/
const STAT=(()=>{
 const lg=x=>{const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5];let y=x,t=x+5.5,s=1.000000000190015;t-=(x+.5)*Math.log(t);for(const k of c)s+=k/++y;return -t+Math.log(2.5066282746310005*s/x)};
 const cf=(a,b,x)=>{const F=v=>Math.abs(v)<1e-30?1e-30:v;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1/F(1-qab*x/qap),h=d;
  for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1/F(1+aa*d);c=F(1+aa/c);h*=d*c;
   aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1/F(1+aa*d);c=F(1+aa/c);const de=d*c;h*=de;if(Math.abs(de-1)<3e-12)break}return h};
 const bi=(a,b,x)=>{if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lg(a+b)-lg(a)-lg(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*cf(a,b,x)/a:1-bt*cf(b,a,1-x)/b};
 const pairT=d=>{const n=d.length,m=d.reduce((a,b)=>a+b,0)/n,sd=Math.sqrt(d.reduce((a,x)=>a+(x-m)**2,0)/(n-1)),t=m/(sd/Math.sqrt(n)),df=n-1;
  return{n,m,sd,t,df,p:sd?bi(df/2,.5,df/(df+t*t)):0,dz:m/sd}};
 const sus=a=>a.slice(0,10).reduce((s,v,i)=>s+(i%2?5-v:v-1),0)*2.5;
 return{pairT,sus};
})();
/*STAT-END*/

function scoreAn(R,pp){
 const n=R.n,pc=x=>Math.round(x/n*100),mps=pc(R.mean),lab=mps>=85?'mastered':mps>=75?'near mastery':mps>=50?'developing':'beginning',tot=R.bands.reduce((a,b)=>a+b,0)||1,
  hard=R.items.filter(x=>x.d!='discard'&&x.p<.5).sort((a,b)=>a.p-b.p).slice(0,3),fix=R.items.filter(x=>x.d=='discard'),ls=a=>a.map(x=>x.q).join(', '),
  who=pp.map((x,j)=>({s:x.student||'Unnamed',t:R.tot[j],a:x.answers})).sort((a,b)=>b.t-a.t),low=who.filter(x=>x.t/n<.5).slice(-6).reverse(),tips=[],

 tips.push(`The class mean percentage score is ${mps}%, which is ${lab}. ${Math.round(R.pass*100)}% of students reached 75% or higher.`+(mps<75?' Consider reteaching the weakest topics before moving on.':''));
 if(R.sd/n<.1)tips.push(`Scores are bunched together (SD ${R.sd.toFixed(1)} points), so this test does not separate stronger from weaker students much. Add a few harder items next time.`);

  const mv=Math.abs(dx)+Math.abs(dy)>.8;el.classList.toggle('mv',mv);if(mv||Math.abs(tilt)>.3)raf=requestAnimationFrame(frame)};

 const go=()=>{if(!on)return;if(dock&&!dock.isConnected)dock=null;const p=dock?dockPos():follow();tx=p.x;ty=p.y;if(!dock)dir=ty<bh+80?'down':'up';kick()};
 const wake=()=>{clearTimeout(slp);if(el.dataset.mood=='sleep')setMood(base);slp=setTimeout(()=>{if(on&&!tip&&!sy.classList.contains('show'))setMood('sleep')},30000)};
 const clearHL=()=>document.querySelectorAll('.bot-hl').forEach(n=>n.classList.remove('bot-hl'));
 const type=txt=>{clearInterval(tw);const n=txt.length,set=k=>{bt.innerHTML=esc(txt.slice(0,k))+'<span class="bs-r">'+esc(txt.slice(k))+'</span>'};
  sr.textContent=txt;set(n);bw=sy.offsetWidth;bh=sy.offsetHeight;
  if(calm()){setMood(base);return}
  let i=0;set(0);setMood('talk');tw=setInterval(()=>{i+=2;set(i);if(i>=n){clearInterval(tw);setMood(base)}},26)};
 const hide=()=>{clearInterval(tw);clearTimeout(hideT);sy.classList.remove('show');clearHL();dock=null;tip=null;base='smile';setMood('smile');go()};
 const show=(t,o={})=>{if(!on)return;clearTimeout(hideT);clearHL();dock=null;tip=o.mini?null:t;base=t.mood||'smile';
  if(t._seen)cfg.set({seen:{...(cfg.get().seen||{}),[t._seen]:1}});if(t._sess)sess.home=t._sess;
  bb.innerHTML=o.mini?'':'<button class="btn sm" data-act="botOk">'+esc(t.ok||'Got it')+'</button><button class="bs-link" data-act="botOff">Hide me</button>';
  sy.classList.toggle('mini',!!o.mini);
  const n=!o.mini&&t.sel&&document.querySelector(t.sel);
  if(n){dock=n;n.classList.add('bot-hl');if(!n.closest('nav')){const r=n.getBoundingClientRect();if(r.top<90||r.bottom>innerHeight-130)n.scrollIntoView({block:'center',behavior:calm()?'auto':'smooth'})}}
  type(t.say);sy.classList.add('show');
  if(t.wave){el.classList.add('wave');setTimeout(()=>el.classList.remove('wave'),2600)}
  if(t.confetti)burst();
  go();if(o.mini)hideT=setTimeout(hide,o.ms||2200)};
 const react=(m,text,ms)=>{if(!on||tip||Date.now()-lastR<2500)return;lastR=Date.now();show({say:text,mood:m},{mini:true,ms})};
 const done=()=>{const t=tip;hide();if(t&&t.done)t.done()};
 const sync=()=>{const w=isOn();
  if(w&&!on){on=true;el.hidden=false;x=innerWidth+10;y=innerHeight-H-128;tx=x;ty=y;go();wake();setMood('happy');el.classList.add('wave');setTimeout(()=>{el.classList.remove('wave');if(!tip)setMood(base)},2200)}
  else if(!w&&on){hide();on=false;el.hidden=true;clearTimeout(slp)}};
 const off=()=>{cfg.set({bot:false});hide();sync();toast('Tsekie is resting. Tap the ? button to call me back.')};
 const tipFor=async(v,force)=>{
  if(v=='home'){const[c,e,s]=await Promise.all(['classes','exams','sheets'].map(k=>db.all(k))),nx=gsteps(c,e,s).find(z=>!z.ok);
   if(nx){if(force||sess.home!=nx.k)return{say:'Hi'+(me?' '+me.name.split(' ')[0]:'')+'! Next up: '+nx.t.toLowerCase()+'. '+nx.d,sel:'[data-step='+nx.k+']',mood:'happy',wave:1,_sess:nx.k};return null}
   if(!cfg.get().farewell)return{say:'You did it! You know the basics now. I will take a nap, but tap the ? button whenever you need me.',mood:'happy',ok:'Bye, Tsekie!',wave:1,confetti:1,done:()=>{cfg.set({bot:false,farewell:1});sync();toast('Tsekie is resting. Tap ? to call me back.')}};
   return force?{say:'You are all set! Tap the big blue button to scan papers, or open Exams to see item analysis.',sel:'nav a.scan',mood:'happy'}:null}
  if(v=='scan'&&!document.querySelector('[data-act=camOn]')&&(force||!(cfg.get().seen||{}).scan))return{say:'The scanner needs an exam with an answer key first. Create one in Exams, then come back!',sel:'nav a[data-t=exams]'};
  if(v=='analysis'&&!document.querySelector('.stats'))return force?{say:'Scan at least 6 papers of one exam and I will show you which items to keep, revise, or discard.',mood:'smile'}:null;
  const t=TIPS[v];if(t&&(force||!(cfg.get().seen||{})[v]))return{...t,_seen:v};return null};
 const onRoute=async v=>{const my=++tok;cur=v;hide();sync();if(!on)return;
  if(v=='scores'&&!me&&(cfg.get().seen||{}).scores){cfg.set({bot:false});sync();return}
  const t=await tipFor(v,false);if(t&&my==tok)setTimeout(()=>{if(my==tok)show(t)},650)};
 const help=async()=>{sync();const t=await tipFor(cur,true);show(t||{say:'Hi! I am Tsekie. Tap the ? button anytime and I will show you around.',mood:'happy',wave:1})};
 const onP=e=>{ptr={x:e.clientX,y:e.clientY,t:e.pointerType=='touch'?'touch':'mouse'};if(!on)return;wake();look(ptr.x,ptr.y);if(!dock)go()};
 addEventListener('pointermove',onP,{passive:true});addEventListener('pointerdown',onP,{passive:true});
 addEventListener('keydown',()=>{if(on)wake()});addEventListener('resize',()=>go());addEventListener('scroll',()=>{if(on&&dock)go()},{passive:true});
 addEventListener('click',e=>{if(tip&&dock&&dock.contains(e.target)&&!e.target.closest('#botSay')){const t=tip;setTimeout(()=>{if(tip===t)done()},80)}},true);
 return{onRoute,show,hide,react,help,ok:done,off,sync}})();

/* ===== Router, status, offline support ===== */
async function render(){
 cam.stop();scn=null;
 const[t,arg]=(location.hash.slice(1)||'home').split('/');let v=V[t]?t:'home';if(!me&&!PUB.includes(v))v='welcome';else if(me&&['welcome','signin','signup'].includes(v))v='home';document.body.classList.toggle('auth',!me);
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t==(v=='sheets'||v=='analysis'?'exams':v=='study'?'settings':v)));
 $('#app').innerHTML=await V[v](arg);scrollTo(0,0);movePill();countUp();BOT.onRoute(v);
}
function pill(){const p=$('#pill'),on=navigator.onLine;p.className='pill'+(on?'':' off');
 p.innerHTML=`<i></i>${on?'Online':'Offline, still works'}${mode=='mem'?' (temporary storage)':''}`}
addEventListener('hashchange',render);addEventListener('resize',movePill);addEventListener('online',()=>A.sync(true));addEventListener('online',pill);addEventListener('offline',pill);
applyTheme();pill();loadMe().then(render).then(()=>{A.sync(true);movePill()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();   /* ask the phone not to clear our data */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
 let had=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{toast(had?'Update installed. Close and reopen TSEKmate to use it.':'Ready to work offline.');had=true});
 navigator.serviceWorker.register('sw.js').catch(()=>{});
}
