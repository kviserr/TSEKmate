<script type="text/plain" id="gas">
/* TSEKmate -> Google Sheets receiver. Paste into Extensions > Apps Script, then Deploy > Web app (Execute as: Me, Access: Anyone). */
function out(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON)}
function col(n){var s='';while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
function safe(v){v=String(v==null?'':v);return /^[=+\-@]/.test(v)?"'"+v:v}

function doGet(){return out({ok:true,app:'TSEKmate',url:SpreadsheetApp.getActiveSpreadsheet().getUrl()})}

function doPost(e){
  var lock=LockService.getScriptLock();lock.waitLock(20000);
  try{
    var d=JSON.parse(e.postData.contents),ss=SpreadsheetApp.getActiveSpreadsheet();
    if(!d.id||!d.key||!d.key.length)throw new Error('Incomplete data');
    var name=String(d.exam||'Exam').replace(/[\[\]*?:\/\\]/g,' ').substring(0,90);
    var sh=ss.getSheetByName(name)||setup(ss,name,d);
    var n=d.key.length,idc=6+n,last=col(5+n),rows=Math.max(sh.getLastRow()-3,1);
    var ids=sh.getRange(4,idc,rows,1).getValues(),r=0,i;
    for(i=0;i<ids.length;i++){if(ids[i][0]===d.id){r=4+i;break}}   /* same paper sent twice = update, never a duplicate */
    if(!r)r=Math.max(sh.getLastRow()+1,4);
    var ans=(d.answers||[]).slice(0,n);while(ans.length<n)ans.push('');
    sh.getRange(r,1,1,idc).setValues([[safe(d.student),'',d.total,'',new Date(d.at||Date.now())].concat(ans,[d.id])]);
    sh.getRange(r,2).setFormula('=SUMPRODUCT(--(F'+r+':'+last+r+'=F$2:'+last+'$2))');   /* edit an answer cell and the score updates */
    sh.getRange(r,4).setFormula('=IFERROR(B'+r+'/C'+r+',0)').setNumberFormat('0%');
    sh.getRange(r,5).setNumberFormat('dd mmm HH:mm');
    return out({ok:true,url:ss.getUrl()+'#gid='+sh.getSheetId(),row:r});
  }catch(err){return out({ok:false,error:String(err)})}
  finally{lock.releaseLock()}
}

function setup(ss,name,d){
  var n=d.key.length,sh=ss.insertSheet(name),last=col(5+n),hd=['Student','Score','Total','Percent','Scanned'],i;
  for(i=1;i<=n;i++)hd.push('Q'+i);hd.push('Paper ID');
  sh.getRange(1,1,1,hd.length).setValues([hd]).setFontWeight('bold').setBackground('#0B1530').setFontColor('#FFFFFF');
  sh.getRange(2,1,1,n+6).setValues([['ANSWER KEY','','','',''].concat(d.key,[''])]).setFontWeight('bold').setBackground('#FFF3BF');
  var f=['% CORRECT BY ITEM','','','',''];
  for(i=0;i<n;i++){var c=col(6+i);f.push('=IFERROR(SUMPRODUCT(--('+c+'$4:'+c+'$1000='+c+'$2))/COUNTA($A$4:$A$1000),"")')}
  f.push('');
  sh.getRange(3,1,1,f.length).setFormulas([f]).setNumberFormat('0%').setFontStyle('italic').setBackground('#E8EEFF');
  sh.setFrozenRows(3);sh.setFrozenColumns(1);sh.setColumnWidth(1,200);sh.hideColumns(6+n);
  var rg=sh.getRange('F4:'+last+'1000');
  sh.setConditionalFormatRules([
    SpreadsheetApp.newConditionalFormatRule().whenFormulaSatisfied('=AND(F4<>"",F4=F$2)').setBackground('#C8F2DC').setRanges([rg]).build(),
    SpreadsheetApp.newConditionalFormatRule().whenFormulaSatisfied('=AND(F4<>"",F4<>F$2)').setBackground('#FFD6D1').setRanges([rg]).build()]);
  return sh;
}
</script>

<script>
/* ===== Core helpers ===== */
const $=s=>document.querySelector(s),L=['','A','B','C','D'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
let _c={};const cfg={get(){try{return JSON.parse(localStorage.getItem('tsek')||'{}')}catch{return _c}},set(v){_c={...cfg.get(),...v};try{localStorage.setItem('tsek',JSON.stringify(_c))}catch{}}};
function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2800)}
const empty=(t,s)=>`<div class="card mute"><b>${t}</b><br>${s}</div>`;

/* ===== Offline data layer: IndexedDB, with in-memory fallback ===== */
const S=['classes','exams','sheets','outbox','study'],mem={classes:[],exams:[],sheets:[],outbox:[],study:[]};let _db,mode;
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('tsekmate',2);r.onupgradeneeded=()=>S.forEach(s=>r.result.objectStoreNames.contains(s)||r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=(s,m,f)=>new Promise((ok,no)=>{const t=_db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)});
const idb=async()=>{if(!mode){try{_db=await open();mode='idb'}catch{mode='mem'}pill()}return mode=='idb'};
const db={
 async all(s){return await idb()?tx(s,'readonly',o=>o.getAll()):[...mem[s]]},
 async put(s,v){if(await idb())return tx(s,'readwrite',o=>o.put(v));mem[s]=mem[s].filter(x=>x.id!=v.id).concat(v)},
 async del(s,id){if(await idb())return tx(s,'readwrite',o=>o.delete(id));mem[s]=mem[s].filter(x=>x.id!=id)},
 async clear(s){if(await idb())return tx(s,'readwrite',o=>o.clear());mem[s]=[]}
};

/* ===== Domain logic (Step 4 will build on these) ===== */
const score=(key,ans)=>ans.filter((a,i)=>a&&a==key[i]).length;
async function saveSheet(ex,student,answers){
 const id=uid();
 await db.put('sheets',{id,examId:ex.id,student,answers,score:score(ex.key,answers),total:ex.n,at:Date.now()});
 await db.put('outbox',{id,status:'pending',at:Date.now()}); /* waits here until the spreadsheet sync can run */
}
function download(name,rows){ /* UTF-8 BOM so Excel opens Filipino names correctly */

/* ===== Item-analysis engine: difficulty, discrimination (upper/lower 27%), distractors, KR-20 ===== */
/*ITEM-START*/
const ITEM=(()=>{

  const N=papers.length,n=key.length;if(N<2)return null;
  const tot=papers.map(a=>a.reduce((s,x,i)=>s+(x&&x==key[i]?1:0),0)),
   ord=tot.map((_,i)=>i).sort((a,b)=>tot[b]-tot[a]||a-b),k=Math.max(1,Math.round(.27*N)),up=ord.slice(0,k),lo=ord.slice(N-k),
   mean=tot.reduce((a,b)=>a+b,0)/N,vr=tot.reduce((a,t)=>a+(t-mean)**2,0)/N;let pq=0;
  const items=key.map((kc,i)=>{
   const cnt={A:0,B:0,C:0,D:0,'':0};papers.forEach(a=>cnt[a[i]||'']++);
   const p=cnt[kc]/N,u=up.filter(j=>papers[j][i]==kc).length,l=lo.filter(j=>papers[j][i]==kc).length,D=(u-l)/k;pq+=p*(1-p);
   const dead=LET.filter(x=>x!=kc&&cnt[x]/N<.05),bad=LET.find(x=>x!=kc&&up.filter(j=>papers[j][i]==x).length>u),why=[];
   if(D<0)why.push('Stronger students did worse on this item than weaker ones.');
   else if(D<.2)why.push('Weak discrimination (D under 0.20).');
   if(bad)why.push('More top scorers chose '+bad+' than the key '+kc+'. Check the answer key.');
   if(p<.25)why.push('Very hard: under 25% answered correctly.');
   if(p>.85)why.push('Very easy: over 85% answered correctly.');
   if(dead.length)why.push('Nobody chose '+dead.join(', ')+', so '+(dead.length>1?'those options do':'that option does')+' not distract.');
   const d=D<0||(bad&&D<.1)?'discard':(D<.2||p<.25||p>.85||dead.length>1)?'revise':'keep';
   return{q:i+1,key:kc,p,D,cnt,d,why,fd:3-dead.length}});
  const c={keep:0,revise:0,discard:0};items.forEach(x=>c[x.d]++);

 return head+`<div class="stats">${stat(R.N,'Papers analyzed')}${stat(Math.round(R.mean/R.n*100)+'%','Average score','g')}
 ${stat(rel,'Reliability (KR-20) '+rl,'y')}${stat(R.c.revise+R.c.discard,'Items to fix',R.c.revise+R.c.discard?'r':'')}</div>
 ${R.N<30?`<p class="mute">With ${R.N} papers, treat these results as a guide. About 30 or more papers give firmer decisions.</p>`:''}
 <div class="card"><h3>Score spread</h3><svg viewBox="0 0 300 112" role="img" aria-label="Score distribution">${bins.map((c,i)=>{const h=c/mx*78;return `<rect x="${i*30+4}" y="${92-h}" width="22" height="${h}" rx="5" style="fill:var(--blue)"/><text x="${i*30+15}" y="106" font-size="9" text-anchor="middle" style="fill:var(--mute)">${i*10}%</text>${c?`<text x="${i*30+15}" y="${87-h}" font-size="10" font-weight="700" text-anchor="middle" style="fill:var(--ink)">${c}</text>`:''}`}).join('')}</svg></div>
 <div class="card"><h3>Test map</h3><span class="mute">${R.c.keep} keep, ${R.c.revise} revise, ${R.c.discard} discard</span>
 <div class="imap">${R.items.map(x=>`<i class="${x.d}" style="--i:${x.q}">${x.q}</i>`).join('')}</div></div>
 <h3 style="margin-top:20px">Items, most urgent first</h3>`+
 [...R.items].sort((a,b)=>order[a.d]-order[b.d]||a.D-b.D).map(x=>`<details class="q"><summary>Q${x.q}<span class="tag ${x.d}">${tag[x.d]}</span><span class="bar"><i style="width:${Math.round(x.p*100)}%"></i></span><span class="mute">${Math.round(x.p*100)}% | D ${x.D.toFixed(2)}</span></summary>
  ${x.why.length?`<p class="mute">${x.why.join(' ')}</p>`:'<p class="mute">Healthy item: it separates stronger from weaker students and every option is working.</p>'}
  ${['A','B','C','D'].map(l=>`<div class="dr"><b>${l}</b><span class="bar ${l==x.key?'k':''}"><i style="width:${x.cnt[l]/R.N*100}%"></i></span><span>${x.cnt[l]}${l==x.key?' (key)':''}</span></div>`).join('')}
  ${x.cnt['']?`<p class="mute">Left blank: ${x.cnt['']}</p>`:''}</details>`).join('')+
 `<div class="row"><button class="btn" data-act="exportItems" data-id="${e.id}">Download analysis for Excel</button></div>
 <details class="q"><summary>How items are judged</summary><p class="mute"><b>Difficulty</b> is the share of students who got the item right. <b>Discrimination (D)</b> is how much more often the top 27% of scorers got it right than the bottom 27%. <b>Keep:</b> D of 0.20 or more, with 25% to 85% correct. <b>Revise:</b> weak D, too hard or too easy, or two or more unused options. <b>Discard:</b> negative D, or the top scorers prefer a wrong option. <b>KR-20</b> shows how consistently the whole test measures students; 0.70 or higher is good.</p></details>`;
};

/* ===== Actions ===== */
const A={
 items(b){draft.n=+b.value;draft.key=Array.from({length:draft.n},(_,i)=>draft.key[i]||'');$('#grid').innerHTML=grid()},
 cell(b){const i=+b.dataset.i;draft.key[i]=L[(L.indexOf(draft.key[i])+1)%5];$('#grid').innerHTML=grid()},
 async addClass(){
  const name=$('#cn').value.trim(),students=$('#cs').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!name)return toast('Enter a class name.');if(!students.length)return toast('Add at least one student.');
  await db.put('classes',{id:uid(),name,students});toast('Class saved.');render();
 },
 async delClass(b){
  await db.del('classes',b.dataset.id);
  for(const e of (await db.all('exams')).filter(x=>x.classId==b.dataset.id)){
   for(const s of (await db.all('sheets')).filter(x=>x.examId==e.id)){await db.del('sheets',s.id);await db.del('outbox',s.id)}
   await db.del('exams',e.id);
  }
  toast('Class deleted.');render();
 },
 async saveExam(){
  const title=$('#et').value.trim(),classId=$('#ec').value,gap=draft.key.indexOf('');
  if(!title)return toast('Enter an exam title.');if(!classId)return toast('Add a class first.');
  if(gap>-1)return toast('Set the answer for item '+(gap+1)+'.');
  await db.put('exams',{id:uid(),classId,title,n:draft.n,key:[...draft.key],at:Date.now()});
  draft={n:draft.n,key:Array(draft.n).fill('')};toast('Exam saved.');render();
 },
 async exportExam(b){
  const ex=(await db.all('exams')).find(x=>x.id==b.dataset.id);if(!ex)return toast('Create or load an exam first.');
  const sh=(await db.all('sheets')).filter(x=>x.examId==ex.id);
  download(ex.title,[[ex.title],[],['Student','Score','Total','Percent',...ex.key.map((_,i)=>'Q'+(i+1))],['ANSWER KEY','','','',...ex.key],
   ...sh.map(s=>[s.student,s.score,s.total,Math.round(s.score/s.total*100)+'%',...s.answers])]);
  toast('Spreadsheet downloaded.');
 },
 async sync(b){
  const quiet=b===true,u=cfg.get().url;
  if(!u)return quiet||toast('Add your Google Sheets link in Settings first.');
  if(!navigator.onLine)return quiet||toast('You are offline. Results are safe and will send later.');
  const [o,s,e]=await Promise.all([db.all('outbox'),db.all('sheets'),db.all('exams')]);let n=0,link,why='';
  for(const x of o.filter(x=>x.status=='pending')){
   const sh=s.find(y=>y.id==x.id),ex=sh&&e.find(y=>y.id==sh.examId);if(!ex)continue;
   try{const r=await(await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({id:sh.id,exam:ex.title,key:ex.key,student:sh.student,answers:sh.answers,total:sh.total,at:sh.at})})).json();
    if(!r.ok)throw new Error(r.error);x.status='synced';await db.put('outbox',x);n++;link=r.url}catch(err){why=err.message||'check your link';break}}
  if(link)cfg.set({sheet:link});
  if(why&&!quiet)toast('Could not send: '+why+'.');else if(n)toast(`Sent ${n} result${n==1?'':'s'} to Google Sheets.`);else if(!quiet)toast('Nothing waiting to send.');
  if(n||why)render();
 },
 async copyGas(){try{await navigator.clipboard.writeText($('#gas').textContent.trim());toast('Script copied. Paste it into Apps Script.')}catch{toast('Copy failed. Open TSEKmate-Code.gs and copy it from there.')}},
 async test(){const u=($('#su').value||cfg.get().url||'').trim();if(!u)return toast('Paste your web app link first.');
  try{const r=await(await fetch(u)).json();if(!r.ok)throw 0;cfg.set({url:u,sheet:r.url});toast('Connected to your spreadsheet.');render()}
  catch{toast('Could not connect. Check the link, and that access is set to Anyone.')}},
 async seed(){
  const names=['Dela Cruz, Juan','Santos, Maria','Reyes, Jose','Garcia, Ana','Mendoza, Paolo','Bautista, Liza','Aquino, Carlo','Ramos, Bea'],classId=uid();
  const key=Array.from({length:40},()=>L[1+Math.floor(Math.random()*4)]);
  const ex={id:uid(),classId,title:'Sample Term Exam – Science 8',n:40,key,at:Date.now()};
  await db.put('classes',{id:classId,name:'Grade 8 – Sampaguita (sample)',students:names});await db.put('exams',ex);
  for(const st of names){const p=.45+Math.random()*.45;
   await saveSheet(ex,st,key.map(k=>Math.random()<p?k:L.slice(1).filter(x=>x!=k)[Math.floor(Math.random()*3)]))}
  toast('Sample class loaded.');render();
 },
 shn(b){sh.n=+b.dataset.n;render()},
 shscan(){sh.scan=!sh.scan;render()},
 out(h){$('#print').innerHTML=h;setTimeout(()=>print(),60)},
 printSheet(){A.out(SHEET.svg(SHEET.layout(sh.n)))},
 async printClass(){
  const cl=(await db.all('classes')).find(c=>c.id==$('#pc').value);if(!cl)return toast('Add a class first.');
  if(cl.students.length>99)return toast('Paper No. goes up to 99. Split this class in two.');
  const ex=(await db.all('exams')).find(e=>e.id==$('#pe').value),n=ex?ex.n:sh.n;
  A.out(cl.students.map((st,i)=>SHEET.svg(SHEET.layout(n,{name:st,paperNo:i+1,section:cl.name,exam:ex?ex.title:''}))).join(''));
 },
 camOn(){cam.on()},
 snap(){if(cam.s)process(cam.frame(1280))},
 fix(b){const i=+b.dataset.q;scn.ans[i]=b.dataset.v;scn.ok.add(i);showRev()},
 discard(){scn=null;$('#rev').innerHTML='';if(cam.s)cam.loop()},
 async saveScan(){const st=$('#stu').value;if(!st)return toast('Choose the student first.');
  const cf=cfg.get();if(cf.ev)await db.put('study',{id:uid(),kind:'acc',examId:scn.ex.id,n:scn.ex.n,key:[...scn.ex.key],read:scn.raw,final:[...scn.ans],truth:[...scn.truth],ms:scn.ms,light:cf.lt||'Normal',marks:cf.mq||'Dark pen',device:cf.dv||'Unspecified',at:Date.now()});
  await saveSheet(scn.ex,st,scn.ans);navigator.vibrate&&navigator.vibrate([20,40,20]);beep(660);setTimeout(()=>beep(990),90);if(score(scn.ex.key,scn.ans)/scn.ex.n>=.9)burst();toast(st.split(',')[0]+': '+score(scn.ex.key,scn.ans)+' / '+scn.ex.n+' saved.');scn=null;$('#rev').innerHTML='';if(cam.s)cam.loop();A.sync(true)},
 goAn(b){location.hash='analysis/'+b.value},
 async exportItems(b){
  const ex=(await db.all('exams')).find(x=>x.id==b.dataset.id),pp=(await db.all('sheets')).filter(x=>x.examId==ex.id),R=ITEM.analyze(ex.key,pp.map(x=>x.answers));
  if(!R)return toast('Scan at least 2 papers first.');
  download(ex.title+' item analysis',[[ex.title],['Papers',R.N,'Average %',Math.round(R.mean/R.n*100),'KR-20',R.kr20==null?'':R.kr20.toFixed(3)],[],
   ['Item','Key','Difficulty (p)','Discrimination (D)','A','B','C','D','Blank','Decision','Notes'],
   ...R.items.map(x=>[x.q,x.key,x.p.toFixed(3),x.D.toFixed(3),x.cnt.A,x.cnt.B,x.cnt.C,x.cnt.D,x.cnt[''],x.d,x.why.join(' ')])]);
  toast('Item analysis downloaded.');
 },
 stTab(b){st.tab=b.dataset.t;render()},
 truth(b){const i=+b.dataset.i;scn.truth[i]=L[(L.indexOf(scn.truth[i])+1)%5];showRev()},
 tamAns(b){st.tam[+b.dataset.i]=+b.dataset.v;b.parentNode.querySelectorAll('.cell').forEach(c=>c.classList.toggle('on',c==b))},
 async tamSave(){if(st.tam.includes(0))return toast('Answer all 24 statements first.');
  await db.put('study',{id:uid(),kind:'tam',role:$('#sr').value.trim(),a:[...st.tam],comment:$('#sc').value.trim(),at:Date.now()});st.tam=Array(24).fill(0);toast('Response saved.');render()},
 async exportStudy(b){const k=b.dataset.k,[all,ex]=await Promise.all([db.all('study'),db.all('exams')]),R=all.filter(r=>r.kind==(k=='items'?'acc':k)).sort((x,y)=>x.at-y.at),d=r=>new Date(r.at).toLocaleString();
  if(k=='acc')download('TSEKmate sheet log',[['Sheet','Exam','Items','Phone','Lighting','Marks','Read ms','Correct responses','Total responses','RRA','True score','Scanned score','Score correct (SCA)','Errors after teacher review','Error details','Logged'],
   ...R.map((r,i)=>{const e=hit(r),key=keyOf(r,ex),ts=key?score(key,r.truth):'',ss=key?score(key,r.read):'';
    return[i+1,(ex.find(x=>x.id==r.examId)||{}).title||'',r.n,r.device,r.light,r.marks,r.ms,e,r.n,(e/r.n).toFixed(4),ts,ss,key?(ts===ss?1:0):'',r.final.filter((x,j)=>x!==r.truth[j]).length,r.read.map((a,j)=>a===r.truth[j]?'':`Q${j+1}:${a||'-'}>${r.truth[j]||'-'}`).filter(Boolean).join(' '),d(r)]})]);
  else if(k=='items'){const A=agree(R,ex),f=x=>x.toFixed(2),rows=[];
   A.rows.forEach(x=>x.c.a.items.forEach((a,i)=>{const b=x.c.b.items[i];rows.push([x.t,i+1,a.key,f(a.p),f(b.p),f(a.p)==f(b.p)?1:0,f(a.D),f(b.D),f(a.D)==f(b.D)?1:0,a.fd,b.fd,a.fd==b.fd?1:0])}));
   download('TSEKmate item comparison',[['Exam','Item','Key','Difficulty (scan)','Difficulty (verified)','DIA match','Discrimination (scan)','Discrimination (verified)','DISA match','Working distractors (scan)','Working distractors (verified)','DEA match'],...rows,[],['Totals','','','','',A.T.dia+' of '+A.T.n,'','',A.T.disa+' of '+A.T.n,'','',A.T.dea+' of '+A.T.n]])}
  else download('TSEKmate acceptability survey',[['Respondent',...TAM.flatMap(([n,c,q])=>q.map((_,j)=>c+(j+1))),...TAM.map(g=>g[1]+' mean'),'Overall','Comment','Logged'],
   ...R.map(r=>{const m=tamMeans([r]);return[r.role||'',...r.a,...m.map(v=>v.toFixed(2)),(m.reduce((a,b)=>a+b,0)/8).toFixed(2),r.comment,d(r)]})]);
  toast('Downloaded for Excel.')},
 theme(){cfg.set({theme:document.documentElement.dataset.theme=='dark'?'Light':'Dark'});applyTheme()},
 install(){if(ip){ip.prompt();ip=null}else toast("iPhone: tap Share, then Add to Home Screen. Android: browser menu, then Install app.")},
 saveCfg(){cfg.set({name:$('#sn').value.trim(),school:$('#ss').value.trim(),url:$('#su').value.trim()});toast('Settings saved.')},
 async wipe(){if(!confirm('Erase all classes, exams, and checked papers on this phone?'))return;for(const s of S)await db.clear(s);toast('All data erased.');render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!/SELECT|INPUT/.test(b.tagName))A[b.dataset.act](b)});
document.addEventListener('change',async e=>{
 if(e.target.dataset.cf){const t=e.target;cfg.set({[t.dataset.cf]:t.type=='checkbox'?t.checked:t.value});applyTheme();if(t.type=='checkbox')render()}
 if(e.target.id=='stu')scn.stu=e.target.value;
 if(e.target.id=='pick'&&e.target.files[0]){try{const bm=await createImageBitmap(e.target.files[0]),k=Math.min(1,1280/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=bm.width*k|0;c.height=bm.height*k|0;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bm,0,0,c.width,c.height);await process(x.getImageData(0,0,c.width,c.height))}catch{toast('That photo could not be opened.')}e.target.value=''}
 const b=e.target.closest('select[data-act]');if(b)A[b.dataset.act](b)});

/* ===== Router, status, offline support ===== */
async function render(){
 cam.stop();scn=null;
 const[t,arg]=(location.hash.slice(1)||'home').split('/'),v=V[t]?t:'home';
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t==(v=='sheets'||v=='analysis'?'exams':v=='study'?'settings':v)));
 $('#app').innerHTML=await V[v](arg);scrollTo(0,0);movePill();countUp();
}
function pill(){const p=$('#pill'),on=navigator.onLine;p.className='pill'+(on?'':' off');
 p.innerHTML=`<i></i>${on?'Online':'Offline, still works'}${mode=='mem'?' (temporary storage)':''}`}
addEventListener('hashchange',render);addEventListener('resize',movePill);addEventListener('online',()=>A.sync(true));addEventListener('online',pill);addEventListener('offline',pill);
applyTheme();pill();render().then(()=>{A.sync(true);movePill()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();   /* ask the phone not to clear our data */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
 let had=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{toast(had?'Update installed. Close and reopen TSEKmate to use it.':'Ready to work offline.');had=true});
 navigator.serviceWorker.register('sw.js').catch(()=>{});
}
